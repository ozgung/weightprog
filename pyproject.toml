[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weightprog"
version = "0.2.1"
description = "Closed-form weight edits of Gemma 4 for coding agents: instruments, constructions, case-based evaluation against matched random edits, and an agent workflow (MLX and PyTorch backends)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ozgun Genc" }]
keywords = ["gemma", "interpretability", "model-editing", "mlx", "pytorch", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "tokenizers>=0.20", "jinja2>=3.1"]

[project.optional-dependencies]
mlx = ["mlx>=0.30", "mlx-lm>=0.30"]
torch = ["torch>=2.4", "transformers>=5.5", "safetensors>=0.4"]
peft = ["peft>=0.15"]
dev = ["pytest>=8"]

[project.scripts]
weightprog = "weightprog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weightprog = ["resources/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mlx: needs the mlx extra",
    "torch: needs the torch extra",
    "regression: reads experiment outputs given by an environment variable",
]
